<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pedro Gabriel - System Online">
  <defs>
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1000" height="300" fill="url(#bgFade)"/>

  <!-- grid tecnico de fundo -->
  <g stroke="#ff6b00" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="50" x2="1000" y2="50"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="550" y1="0" x2="550" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="850" y1="0" x2="850" y2="300"/>
  </g>

  <!-- scanline animada -->
  <rect x="0" y="0" width="1000" height="3" fill="#ff6b00" opacity="0.12">
    <animate attributeName="y" values="0;300;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- moldura HUD - cantos -->
  <g stroke="#ff6b00" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="14,40 14,14 40,14"/>
    <polyline points="960,14 986,14 986,40"/>
    <polyline points="14,260 14,286 40,286"/>
    <polyline points="960,286 986,286 986,260"/>
  </g>

  <!-- indicador de status -->
  <circle cx="32" cy="32" r="4.5" fill="#ff6b00">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="37" fill="#ff6b00" font-family="Courier New, monospace" font-size="12" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- info tecnica canto superior direito -->
  <text x="960" y="33" fill="#ff6b00" fill-opacity="0.55" font-family="Courier New, monospace" font-size="10" text-anchor="end" letter-spacing="1">NODE // BR-DEV-2026</text>
  <text x="960" y="48" fill="#ff6b00" fill-opacity="0.55" font-family="Courier New, monospace" font-size="10" text-anchor="end" letter-spacing="1">ACCESS // PUBLIC</text>

  <!-- nome principal -->
  <text x="60" y="140" fill="#ff7a1e" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="2" opacity="0">
    PEDRO GABRIEL
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
  </text>
  <text x="62" y="168" fill="#ffffff" fill-opacity="0.65" font-family="Courier New, monospace" font-size="15" letter-spacing="3">PROFILE // PEDRO GABRIEL</text>

  <!-- linhas de status estilo terminal -->
  <text x="62" y="205" fill="#ff6b00" font-family="Courier New, monospace" font-size="13" letter-spacing="1">STATUS // LEARNING</text>
  <text x="62" y="225" fill="#ff6b00" font-family="Courier New, monospace" font-size="13" letter-spacing="1">ROLE // BEGINNER FULL STACK DEVELOPER</text>
  <text x="62" y="245" fill="#ff6b00" font-family="Courier New, monospace" font-size="13" letter-spacing="1">OBJECTIVE // INFORMATION SYSTEMS</text>
  <text x="62" y="265" fill="#ff6b00" font-family="Courier New, monospace" font-size="13" letter-spacing="1">LOCATION // BRAZIL</text>

  <!-- barra de carregamento -->
  <rect x="62" y="282" width="220" height="4" fill="#2a2a2a"/>
  <rect x="62" y="282" height="4" fill="#ff6b00">
    <animate attributeName="width" values="0;220;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- carimbo classificado -->
  <g transform="translate(845,235) rotate(-10)" opacity="0.9">
    <rect x="-78" y="-20" width="156" height="40" fill="none" stroke="#ff6b00" stroke-width="2"/>
    <text x="0" y="6" fill="#ff6b00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">REDACTED</text>
  </g>

  <!-- coordenadas decorativas -->
  <text x="845" y="270" fill="#ff6b00" fill-opacity="0.4" font-family="Courier New, monospace" font-size="9" text-anchor="middle" letter-spacing="1">SEC.LVL // 01</text>
</svg>
