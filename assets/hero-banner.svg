<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pedro Gabriel">
  <rect width="1000" height="280" fill="#000000"/>

  <text x="500" y="70" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="6" text-anchor="middle">DEVELOPER&#160;&#160;/&#160;&#160;BRAZIL</text>

  <text x="500" y="150" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="4" text-anchor="middle" opacity="0">
    PEDRO GABRIEL
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.05s" fill="freeze"/>
  </text>

  <line x1="440" y1="182" x2="560" y2="182" stroke="#ffffff" stroke-width="1" stroke-opacity="0">
    <animate attributeName="stroke-opacity" from="0" to="0.6" dur="0.8s" begin="0.9s" fill="freeze"/>
  </line>

  <text x="500" y="220" fill="#ffffff" fill-opacity="0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="300" letter-spacing="5" text-anchor="middle">
    BELIEVE IN YOURSELF.
    <animate attributeName="fill-opacity" from="0" to="0.75" dur="1s" begin="1.1s" fill="freeze"/>
  </text>
</svg>
